<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="底片盒">
<meta name="theme-color" content="#0e0d0b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>

<body>
<title>底片盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen camera — live viewfinder on top, film-box strip and shutter row pinned below. Deliberately single dark look. */
:root {
  --bg: #0e0d0b;
  --surface: #1a1814;
  --surface-2: #26231d;
  --fg: #f3eee4;
  --muted: #cfc6b5;
  --accent: #f2b33d;
  --accent-ink: #1a1305;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Noto Sans TC", -apple-system, "PingFang TC", sans-serif;
  --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; padding-inline: 16px;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; min-height: 58px;
}
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .04em; line-height: 1; }
.brand small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.btn {
  appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  font: 700 15px/1 var(--body); padding: 11px 18px; color: var(--fg); background: var(--surface-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .frame-opt:focus-visible, .round:focus-visible, .thumb:focus-within, .shutter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.pick { position: relative; overflow: hidden; }
.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; }

.stage {
  flex: 1 1 auto; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.stage canvas { display: block; max-width: 100%; max-height: 100%; }
#view { box-shadow: 0 10px 40px #0008; }
.badge {
  position: absolute; top: 10px; left: 10px; background: #000a; color: var(--fg);
  font: 500 12px/1 var(--body); padding: 6px 10px; border-radius: 999px;
}
.cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
.cam-msg p { max-width: 26ch; line-height: 1.6; font-size: 15px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
.flash.on { opacity: .85; transition: none; }
#video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.hint { font-size: 12px; color: var(--muted); text-align: center; padding-block: 8px 2px; min-height: 18px; }
.hint b { color: var(--fg); font-weight: 700; }

.panel { padding-block: 6px 2px; }
.strip {
  display: flex; gap: 10px; overflow-x: auto; padding-block: 4px 6px;
  scroll-snap-type: x proximity; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px;
}
.strip::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; width: 76px; border: 0; padding: 0; background: none; color: var(--fg);
  cursor: pointer; scroll-snap-align: start; text-align: left;
}
.chip .box {
  width: 76px; height: 76px; border-radius: 10px; overflow: hidden;
  outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s;
  background: radial-gradient(circle at 50% 35%, #2c2822, #15130f);
}
.chip svg { width: 100%; height: 100%; display: block; }
.chip .name { font-size: 12px; margin-top: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip[aria-pressed="true"] .box { outline-color: var(--accent); }
.chip[aria-pressed="true"] .name { color: var(--accent); font-weight: 700; }

.shutter-row {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
}
.round {
  width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; justify-content: center;
}
.round svg { width: 24px; height: 24px; }
.thumb {
  justify-self: start; width: 56px; height: 56px; border-radius: 8px; cursor: pointer;
  border: 0; background: var(--surface-2); color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center;
}
.thumb svg { width: 24px; height: 24px; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shutter-row .round:last-child { justify-self: end; }
.shutter {
  width: 74px; height: 74px; border-radius: 50%; cursor: pointer;
  border: 4px solid var(--fg); background: var(--fg); box-shadow: inset 0 0 0 4px var(--bg);
}
.shutter:active { transform: scale(.94); }
.shutter[disabled] { opacity: .4; }

.frames { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 6px; }
.frame-opt {
  border: 0; cursor: pointer; background: var(--surface-2); color: var(--fg);
  font: 500 14px/1 var(--body); padding: 10px 14px; border-radius: 10px;
}
.frame-opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; padding-block: 8px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.stamp-demo { font-family: var(--mono); color: #ff8a1f; text-shadow: 0 0 6px #ff6a0099; }

nav.tabs {
  display: grid; grid-template-columns: repeat(2, 1fr);
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab {
  border: 0; background: none; color: var(--fg); cursor: pointer;
  font: 500 16px/1 var(--body); padding: 12px 0 10px; position: relative;
}
.tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 50%; bottom: 2px; width: 22px; height: 3px;
  border-radius: 2px; background: var(--accent); transform: translateX(-50%);
}

.overlay {
  position: fixed; inset: 0; background: #000c; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; z-index: 10; text-align: center;
}
.overlay img { max-height: 70%; max-width: 100%; -webkit-touch-callout: default; }
.overlay p { max-width: 32ch; line-height: 1.6; font-size: 15px; }
.spinner {
  width: 46px; height: 46px; border-radius: 50%;
  border: 4px solid var(--surface-2); border-top-color: var(--accent); animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .chip .box { transition: none; } }
</style>

<div class="app" id="app">
  <header>
    <div class="brand" id="brand">底片盒<small>老相機濾鏡</small></div>
    <button class="btn" id="back" type="button" hidden>返回相機</button>
    <button class="btn primary" id="save" type="button" hidden>儲存</button>
  </header>

  <div class="stage" id="stage" aria-label="取景畫面">
    <canvas id="live"></canvas>
    <canvas id="view" hidden></canvas>
    <div class="cam-msg" id="cam-msg" hidden>
      <p id="cam-msg-text">正在開啟相機…</p>
      <label class="btn primary pick" for="file2">從相簿選照片<input id="file2" type="file" accept="image/*"></label>
    </div>
    <div class="flash" id="flash"></div>
    <span class="badge" id="badge" hidden>原圖</span>
    <video id="video" playsinline muted autoplay></video>
  </div>
  <div class="hint" id="hint"></div>

  <section class="panel" id="panel-filter" role="tabpanel">
    <div class="strip" id="strip"></div>
  </section>

  <section class="panel" id="panel-frame" role="tabpanel" hidden>
    <div class="frames" id="frames"></div>
    <label class="toggle"><input type="checkbox" id="stamp"> 加上日期戳 <span class="stamp-demo" id="stamp-demo"></span></label>
  </section>

  <div class="shutter-row" id="shutter-row">
    <label class="thumb pick" for="file" aria-label="從相簿選照片">
      <img id="thumb" alt="" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
      <input id="file" type="file" accept="image/*">
    </label>
    <button class="shutter" id="shutter" type="button" aria-label="拍照" disabled></button>
    <button class="round" id="flip" type="button" aria-label="切換前後鏡頭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>
    </button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-panel="panel-filter" aria-selected="true" type="button">濾鏡</button>
    <button class="tab" role="tab" data-panel="panel-frame" aria-selected="false" type="button">相框</button>
  </nav>
</div>

<div class="overlay" id="busy" hidden><div class="spinner"></div><p>沖洗中…</p></div>
<div class="overlay" id="result" hidden>
  <img id="result-img" alt="完成的照片">
  <p id="result-tip">長按照片，選「加入照片」就能存到相簿。</p>
  <div class="actions"><button class="btn primary" id="result-share" type="button" hidden>存到相簿</button><button class="btn" id="result-close" type="button">關閉</button></div>
</div>

<script>
/* ---------- 濾鏡配方 ---------- */
const FILTERS = [
  { id:"none", name:"無", label:"ORIGINAL", c:["#3a362e","#f3eee4"], desc:"原始照片", grain:0, vig:0 },
  { id:"retro", name:"Retro", label:"RETRO", c:["#1d4f9c","#ffffff"], desc:"乾淨暖調：黑色保持乾淨，只留一點復古溫度",
    temp:.18, contrast:.14, fade:.02, sat:-.04, shadows:[-.01,.01,.03], highs:[.04,.02,-.03], grain:.05, vig:.1 },
  { id:"cp200", name:"Kodak CP200", label:"COLORPLUS 200", c:["#f6c21c","#c8102e"], desc:"柯達 ColorPlus 200：暖黃、飽和，最經典的日常底片",
    temp:.35, tint:-.04, contrast:.12, fade:.05, sat:.15, shadows:[-.01,.025,0], highs:[.05,.03,-.05], greenShift:-.4, grain:.3, vig:.2 },
  { id:"eterna", name:"Fuji E", label:"FUJI ETERNA", c:["#1f2e5c","#e8ecf6"], desc:"富士電影底片 Eterna：低對比、低飽和，偏青的電影感",
    temp:-.1, contrast:-.22, fade:.06, sat:-.3, shadows:[-.02,.02,.045], highs:[.02,.01,-.01], grain:.15, vig:.15 },
  { id:"cneg", name:"Classic Neg.", label:"CLASSIC NEG", c:["#1f8a3a","#f3e94a"], desc:"富士 Classic Neg：硬對比、暗部偏青，像 90 年代沖印店",
    contrast:.25, fade:.03, sat:-.05, shadows:[-.03,.012,.045], highs:[.045,.02,-.02], greenShift:.5, grain:.2, vig:.15 },
  { id:"chrome", name:"Classic Chrome", label:"CLASSIC CHROME", c:["#c99a2e","#3b2a14"], desc:"富士 Classic Chrome：沉穩低彩，紀實攝影的味道",
    temp:.05, contrast:.2, sat:-.32, blueSat:-.35, shadows:[0,.006,.022], highs:[.02,.015,0], grain:.1, vig:.15 },
  { id:"nneg", name:"Nostalgic Neg.", label:"NOSTALGIC", c:["#4057b8","#f2d27a"], desc:"富士 Nostalgic Neg：琥珀色亮部，柔和的懷舊午後",
    temp:.3, contrast:-.05, fade:.05, sat:.05, shadows:[.01,0,.02], highs:[.065,.03,-.035], grain:.15, vig:.2, glow:.1 },
  { id:"hass", name:"Hass", label:"HASS BLUE", c:["#2b2b2b","#9fc3e6"], desc:"哈蘇冷調：乾淨、偏冷、細節清楚",
    temp:-.25, contrast:.06, sat:-.05, highs:[0,.01,.03], grain:0, vig:.1 },
  { id:"cs800t", name:"CineStill 800T", label:"CINESTILL 800T", c:["#c8102e","#ffffff"], desc:"CineStill 800T：夜晚燈光周圍會泛出紅暈，偏藍的電影夜景",
    temp:-.35, tint:-.04, contrast:.1, sat:.05, shadows:[-.02,.01,.05], halation:.75, grain:.35, vig:.2 },
  { id:"v50d", name:"50D", label:"VISION 50D", c:["#2e7d6e","#ffffff"], desc:"柯達電影底片 50D：細緻、自然，日光下最乾淨",
    contrast:.05, fade:.02, highs:[.02,.01,0], roll:.25, grain:.08, vig:.1 },
  { id:"v250d", name:"250D", label:"VISION 250D", c:["#e8b54a","#5a2d0c"], desc:"柯達電影底片 250D：微暖、有一點顆粒的電影日景",
    temp:.15, fade:.04, sat:.05, highs:[.03,.015,-.01], roll:.25, grain:.18, vig:.15 },
  { id:"v500t", name:"500T", label:"VISION 500T", c:["#6c95c2","#ffffff"], desc:"柯達電影底片 500T：室內鎢絲燈片，冷暗部、暖亮部",
    temp:-.2, contrast:.05, shadows:[-.02,.01,.04], highs:[.03,.01,-.02], halation:.3, grain:.3, vig:.2 },
  { id:"instax", name:"Insta Color", label:"INSTAX", c:["#ffffff","#e4002b"], desc:"拍立得 Instax：明亮、色彩鮮，像現場吐出來的小相紙",
    exp:.15, contrast:.15, fade:.03, sat:.2, temp:-.05, shadows:[0,.01,.03], roll:.3, grain:.05, vig:.1 },
  { id:"instaxbw", name:"Insta STD", label:"INSTAX B&W", c:["#e9e6df","#222222"], desc:"Instax 黑白：柔和灰階，安靜的黑白小相紙",
    mono:true, contrast:.2, fade:.05, grain:.15, vig:.15 },
  { id:"polaroid", name:"Polaroid", label:"POLAROID", c:["#f4f1ea","#2a6fdb"], desc:"寶麗來：褪色、暗部偏綠，老家相簿的顏色",
    temp:.1, contrast:-.1, fade:.15, sat:-.15, shadows:[0,.03,.02], highs:[.04,.03,-.03], glow:.2, grain:.2, vig:.35 },
  { id:"grd", name:"GRd", label:"RICOH GR", c:["#1c1c1c","#7bd88f"], desc:"理光 GR 正片風：高對比、濃郁，街拍感重",
    temp:.1, contrast:.3, sat:.15, shadows:[0,0,.02], highs:[.03,.01,-.03], grain:.12, vig:.25 },
  { id:"natural", name:"Natural", label:"NATURAL", c:["#6cc3f0","#ffffff"], desc:"自然：只加一點底片質感，顏色幾乎不動",
    contrast:.05, sat:.05, fade:.01, roll:.2, grain:.06, vig:.05 },
  { id:"softy", name:"Softy", label:"SOFTY", c:["#e5c21f","#556b1e"], desc:"柔焦：低對比、亮部發光，粉嫩空氣感",
    exp:.1, temp:.05, contrast:-.25, fade:.1, sat:-.1, highs:[.02,.008,.012], glow:.4, grain:.08, vig:.05 },
  { id:"cinema", name:"Cinema", label:"CINEMA", c:["#e0602a","#13465a"], desc:"電影青橙調：暗部青、膚色暖，好萊塢大片感",
    contrast:.15, sat:-.05, shadows:[-.035,.02,.065], highs:[.06,.02,-.04], grain:.15, vig:.25 },
  { id:"hk", name:"HongKong", label:"HONG KONG", c:["#4a4130","#ffffff"], desc:"港風：綠調暗部、霓虹暖光，王家衛式的夜",
    temp:.1, contrast:.2, sat:.15, shadows:[-.02,.045,0], highs:[.05,.03,-.04], greenShift:.3, halation:.25, grain:.3, vig:.3 },
];
const FRAMES = [
  { id:"none", name:"無" }, { id:"black", name:"黑邊" }, { id:"white", name:"白邊" },
  { id:"instax", name:"拍立得直式" }, { id:"wide", name:"拍立得橫式" },
];

/* ---------- 影像處理 ---------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function softclip(x, roll) {
  if (roll <= 0) return x;
  const t = 1 - roll;
  return x <= t ? x : t + roll * (1 - Math.exp(-(x - t) / roll));
}
function contrastCurve(x, c) {
  if (c >= 0) { const s = x * x * (3 - 2 * x); return x + (s - x) * Math.min(1, c * 1.8); }
  return 0.5 + (x - 0.5) * (1 + c * 0.9);
}
function buildLUTs(f, adj) {
  const gain = Math.pow(2, (f.exp || 0) + adj.exp * 0.8);
  const temp = (f.temp || 0) + adj.temp * 0.6, tint = f.tint || 0;
  const gains = [gain * (1 + temp * .12 + tint * .03), gain * (1 - tint * .06), gain * (1 - temp * .14 + tint * .03)];
  const con = f.contrast || 0, fade = f.fade || 0, roll = f.roll ?? .15;
  const sh = f.shadows || [0,0,0], hi = f.highs || [0,0,0];
  return [0,1,2].map(c => {
    const lut = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      let x = (i / 255) * gains[c];
      x = softclip(x, roll);
      x = contrastCurve(clamp01(x), con);
      x += sh[c] * 1.6 * (1 - x) * (1 - x) + hi[c] * 1.3 * x * x;
      x = fade + x * (1 - fade * 1.1);
      lut[i] = clamp01(x) * 255;
    }
    return lut;
  });
}
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(src.length);
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < h; y++) {
      let acc = 0; const row = y * w;
      for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[row + x] = acc / (2 * r + 1);
        acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        src[y * w + x] = acc / (2 * r + 1);
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
  }
  return src;
}
/* 亮部光暈遮罩：縮小取樣→挑亮處→模糊 */
function glowMap(canvas, threshold) {
  const W = canvas.width, H = canvas.height;
  const sw = Math.max(16, Math.round(W / 8)), sh = Math.max(16, Math.round(H / 8));
  const c = document.createElement("canvas"); c.width = sw; c.height = sh;
  const x = c.getContext("2d"); x.drawImage(canvas, 0, 0, sw, sh);
  const d = x.getImageData(0, 0, sw, sh).data, m = new Float32Array(sw * sh);
  for (let i = 0, j = 0; j < m.length; i += 4, j++) {
    const l = (d[i] * .3 + d[i+1] * .59 + d[i+2] * .11) / 255;
    m[j] = l > threshold ? (l - threshold) / (1 - threshold) : 0;
  }
  boxBlur(m, sw, sh, Math.max(2, Math.round(Math.min(sw, sh) / 30)));
  return { m, sw, sh };
}
function sampleMap(g, fx, fy) {
  const x = fx * (g.sw - 1), y = fy * (g.sh - 1);
  const x0 = x | 0, y0 = y | 0, x1 = Math.min(g.sw - 1, x0 + 1), y1 = Math.min(g.sh - 1, y0 + 1);
  const tx = x - x0, ty = y - y0, m = g.m, w = g.sw;
  const a = m[y0 * w + x0] + (m[y0 * w + x1] - m[y0 * w + x0]) * tx;
  const b = m[y1 * w + x0] + (m[y1 * w + x1] - m[y1 * w + x0]) * tx;
  return a + (b - a) * ty;
}

      vec3 o=texture2D(img,vec2(flipX>.5?1.-uv.x:uv.x,uv.y)).rgb;vec3 c=lutc(o);
      if(mono>.5){c=vec3(dot(c,vec3(.3,.59,.11)));}else{
        float w=c.g-max(c.r,c.b);
        if(gs!=0.&&w>0.){if(gs>0.){c.b+=w*gs;c.g-=w*gs*.25;}else{c.r+=w*(-gs);}}
        float wb=c.b-max(c.r,c.g);
        if(bs!=0.&&wb>0.){float l=dot(c,vec3(.3,.59,.11));c+=(c-l)*(wb*bs*2.);}
        float l2=dot(c,vec3(.299,.587,.114));c=l2+(c-l2)*sat;}
      vec4 b=texture2D(blur,vec2(uv.x,1.-uv.y));
      if(halo>0.){float h=b.r*halo;c+=(1.-c)*h*vec3(1.,.28,.12);}
      if(glow>0.){float g=b.g*glow*.8;c+=(1.-c)*g*vec3(1.,.96,.9);}
      if(vig>0.){float dd=length((uv-.5)*res)/length(res*.5);float t=clamp((dd-.45)/.6,0.,1.);c*=1.-vig*.75*t*t*(3.-2.*t);}

  function prog(fs) {

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    return t;
  }
  const imgTex = tex(), lutTex = tex(), noiseTex = tex(gl.NEAREST, gl.REPEAT);
  { // 顆粒雜訊（固定種子）
    const rnd = mulberry32(7), d = new Uint8Array(256 * 256 * 4);
    for (let i = 0; i < d.length; i += 4) { const n = (rnd() + rnd() + rnd() - 1.5) * 1.15; const v = Math.max(0, Math.min(255, Math.round((n / 3.4 + .5) * 255))); d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
    gl.bindTexture(gl.TEXTURE_2D, noiseTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  }
  const fbos = [];
  function ensureFbos(w, h) {
    if (fbos.length && fbos[0].w === w && fbos[0].h === h) return;
    for (const f of fbos) { gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.t); }
    fbos.length = 0;
    for (let i = 0; i < 2; i++) {
      const t = tex(); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

  /* source：video／canvas／image；回傳的是 GPU 畫布本身（尺寸 w×h） */

    setLut(f);
    const halo = f.halation || 0, glow = f.glow || 0, flip = opt.flip ? 1 : 0;
    const sw = Math.max(16, Math.round(w / 8)), sh = Math.max(16, Math.round(h / 8));
    if (halo > 0 || glow > 0) {
      ensureFbos(sw, sh);
      gl.viewport(0, 0, sw, sh);
      gl.useProgram(P.bright.p); gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0].fb);
      gl.uniform1i(P.bright.u.img, 0); gl.uniform2f(P.bright.u.size, sw, sh); gl.uniform1f(P.bright.u.flipX, flip);
      gl.uniform2f(P.bright.u.itx, 2 / sw, 2 / sh);

      gl.useProgram(P.blur.p); gl.uniform1i(P.blur.u.tex, 1); gl.uniform2f(P.blur.u.size, sw, sh);
      gl.activeTexture(gl.TEXTURE1);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1].fb); gl.bindTexture(gl.TEXTURE_2D, fbos[0].t); gl.uniform2f(P.blur.u.dir, s, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0].fb); gl.bindTexture(gl.TEXTURE_2D, fbos[1].t); gl.uniform2f(P.blur.u.dir, 0, s); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, w, h);
    const U = P.final.u; gl.useProgram(P.final.p);

    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, lutTex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fbos.length ? fbos[0].t : noiseTex);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.uniform1i(U.img, 0); gl.uniform1i(U.lut, 1); gl.uniform1i(U.blur, 2); gl.uniform1i(U.noise, 3);
    gl.uniform2f(U.res, w, h); gl.uniform1f(U.flipX, flip);

})();

/* GPU 不能用時退回 CPU 版本 */
function process(srcCanvas, f) {
  if (GPU) return GPU.render(srcCanvas, srcCanvas.width, srcCanvas.height, f);
  return develop(srcCanvas, f, { amount: f.id === "none" ? 0 : 1, exp: 0, temp: 0, grain: f.grain || 0, vig: f.vig || 0, glow: f.glow || 0 });
}

/* ---------- 介面狀態 ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("filmbox:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("filmbox:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  mode: "camera", img: null, date: new Date(),
  filter: store.get("filter", "cp200"), frame: "none", stamp: false,
};
const filterById = id => FILTERS.find(f => f.id === id) || FILTERS[0];
let previewSrc = null, previewOut = null, previewOrig = null;

const view = $("view"), vctx = view.getContext("2d"), live = $("live"), video = $("video");
function fitBox(w, h) {
  const r = $("stage").getBoundingClientRect(), a = w / h;
  return r.width / r.height > a ? { w: r.height * a, h: r.height } : { w: r.width, h: r.width / a };
}
function draw(canvas) {
  view.width = canvas.width; view.height = canvas.height; vctx.drawImage(canvas, 0, 0);
  const b = fitBox(canvas.width, canvas.height); view.style.width = b.w + "px"; view.style.height = b.h + "px";
}
function setHint() {
  const f = filterById(state.filter);
  $("hint").innerHTML = `<b>${f.name}</b>　${f.desc}`;
}

/* ---------- 相機 ---------- */
let stream = null, facing = store.get("facing", "environment"), raf = 0, frameNo = 0;
function camMessage(text) { $("cam-msg-text").textContent = text; $("cam-msg").hidden = !text; }
function stopCamera() {
  cancelAnimationFrame(raf); raf = 0;
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
  video.srcObject = null; $("shutter").disabled = true;
}
async function startCamera() {
  stopCamera();
  if (!GPU) { camMessage("這台裝置沒辦法即時預覽濾鏡，可以從相簿選照片。"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMessage("這裡沒辦法開啟相機，可以從相簿選照片。"); return; }
  camMessage("正在開啟相機…");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facing, width: { ideal: 4032 }, height: { ideal: 3024 } } });
    video.srcObject = stream; await video.play();
    camMessage(""); $("shutter").disabled = false; live.hidden = false;
    loop();
  } catch (err) {
    stopCamera();
    camMessage(err && err.name === "NotAllowedError"
      ? "相機權限被拒絕了。請到 iPhone「設定 → Safari → 相機」改成允許，或先從相簿選照片。"
      : "沒辦法開啟相機，可以先從相簿選照片。");
  }
}
function loop() {
  raf = requestAnimationFrame(loop);
  if (state.mode !== "camera" || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight, b = fitBox(vw, vh);
  const dpr = Math.min(3, devicePixelRatio || 1);
  let cw = Math.round(b.w * dpr), ch = Math.round(b.h * dpr);
  const cap = Math.min(GPU.maxTex, 2000) / Math.max(cw, ch); if (cap < 1) { cw = Math.round(cw * cap); ch = Math.round(ch * cap); }
  live.style.width = b.w + "px"; live.style.height = b.h + "px";
  frameNo++;
  GPU.render(video, cw, ch, filterById(state.filter), { live: true, flip: facing === "user", seed: (frameNo % 6) * .173 });
}
$("flip").addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; store.set("facing", facing); startCamera(); });
$("shutter").addEventListener("click", () => {
  if (!video.videoWidth) return;
  const c = document.createElement("canvas"); c.width = video.videoWidth; c.height = video.videoHeight;
  const x = c.getContext("2d");
  if (facing === "user") { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(video, 0, 0);
  $("flash").classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => $("flash").classList.remove("on")));
  enterEdit(c, new Date());
});

/* ---------- 編輯（拍完或選照片後） ---------- */
function previewSide() {
  const r = $("stage").getBoundingClientRect();
  return Math.min(GPU ? GPU.maxTex : 2000, 2400, Math.round(Math.max(r.width, r.height) * Math.min(3, devicePixelRatio || 1)));
}
function rebuildSource() {
  previewSrc = cropFor(state.img, state.frame, previewSide());
  previewOrig = compose(previewSrc, state.frame, false, state.date);
}
let pending = false;
function render() {
  if (state.mode !== "edit" || pending) return; pending = true;
  requestAnimationFrame(() => {
    pending = false;
    previewOut = compose(process(previewSrc, filterById(state.filter)), state.frame, state.stamp, state.date);
    draw(previewOut);
  });
}
/* 左下角照片框：顯示最近拍或選的那張 */
function setThumb(img) {
  const c = cropFor(img, "polaroid", 120);
  $("thumb").src = c.toDataURL("image/jpeg", .8); $("thumb").hidden = false;
}
function enterEdit(img, date) {
  stopCamera(); setThumb(img);
  state.mode = "edit"; state.img = img; state.date = date || new Date();
  $("stamp-demo").textContent = stampText(state.date);
  live.hidden = true; view.hidden = false; camMessage("");
  $("brand").hidden = true; $("back").hidden = false; $("save").hidden = false;
  $("shutter-row").hidden = true; $("tabs").hidden = false;
  $("stage").setAttribute("aria-label", "照片預覽，按住可看原圖");
  rebuildSource(); render();
}
function enterCamera() {
  state.mode = "camera"; state.img = null;
  live.hidden = true; view.hidden = true; $("badge").hidden = true;
  $("brand").hidden = false; $("back").hidden = true; $("save").hidden = true;
  $("shutter-row").hidden = false; $("tabs").hidden = true;
  selectTab("panel-filter");
  $("stage").setAttribute("aria-label", "取景畫面");
  startCamera();
}
$("back").addEventListener("click", enterCamera);

/* 濾鏡列 */
function buildStrip() {
  const strip = $("strip");
  for (const f of FILTERS) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.id = f.id; b.setAttribute("aria-pressed", f.id === state.filter);
    b.setAttribute("aria-label", f.name);
    const box = document.createElement("div"); box.className = "box"; box.innerHTML = CAMERA_ICONS(f.id);
    const name = document.createElement("div"); name.className = "name"; name.textContent = f.name;
    b.append(box, name);
    b.addEventListener("click", () => selectFilter(f.id));
    strip.append(b);
  }
}
function selectFilter(id) {
  state.filter = id; store.set("filter", id);
  for (const b of $("strip").children) b.setAttribute("aria-pressed", b.dataset.id === id);
  setHint(); render();
}
/* 相框 */
function buildFrames() {
  for (const fr of FRAMES) {
    const b = document.createElement("button"); b.className = "frame-opt"; b.type = "button";
    b.textContent = fr.name; b.dataset.id = fr.id; b.setAttribute("aria-pressed", fr.id === state.frame);
    b.addEventListener("click", () => setFrame(fr.id));
    $("frames").append(b);
  }
}
function setFrame(id) {
  state.frame = id;
  for (const b of $("frames").children) b.setAttribute("aria-pressed", b.dataset.id === id);
  if (state.mode === "edit") { rebuildSource(); render(); }
}
$("stamp").addEventListener("change", e => { state.stamp = e.target.checked; render(); });
function selectTab(panel) {
  for (const o of document.querySelectorAll(".tab")) { const on = o.dataset.panel === panel; o.setAttribute("aria-selected", on); $(o.dataset.panel).hidden = !on; }
}
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => selectTab(t.dataset.panel));

/* 按住看原圖 */
const stage = $("stage");
const showOrig = on => { if (state.mode !== "edit" || !previewOut) return; draw(on ? previewOrig : previewOut); $("badge").hidden = !on; };
stage.addEventListener("pointerdown", () => showOrig(true));
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) stage.addEventListener(ev, () => showOrig(false));

/* 選照片 */
function decodeImage(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(blob);
    img.onload = () => resolve(img);
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
let heicLib = null;
function loadHeicLib() {
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (heicLib) return heicLib;
  heicLib = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    s.onload = () => window.heic2any ? resolve(window.heic2any) : reject(new Error("heic"));
    s.onerror = () => { heicLib = null; reject(new Error("heic")); };
    document.head.append(s);
  });
  return heicLib;
}
const isHeic = f => /hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name || "");
async function openFile(file) {
  $("busy").querySelector("p").textContent = "讀取照片中…";
  $("busy").hidden = false;
  try {
    let img = null;
    if (!isHeic(file)) img = await decodeImage(file).catch(() => null);
    if (!img) {
      const heic2any = await loadHeicLib();
      let jpg = await heic2any({ blob: file, toType: "image/jpeg", quality: .95 });
      if (Array.isArray(jpg)) jpg = jpg[0];
      img = await decodeImage(jpg);
    }
    enterEdit(img, new Date(file.lastModified || Date.now()));
  } catch (err) {
    $("hint").innerHTML = "<b>這張照片打不開。</b>請換一張試試，或先在照片 App 裡把它輸出成 JPG。";
  } finally {
    $("busy").hidden = true;
    $("busy").querySelector("p").textContent = "沖洗中…";
  }
}
for (const id of ["file", "file2"]) $(id).addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (file) openFile(file);
  e.target.value = "";
});

/* 儲存：原解析度重新沖洗 */
$("save").addEventListener("click", async () => {
  if (!state.img) return;
  $("busy").hidden = false;
  await new Promise(r => setTimeout(r, 60));
  try {
    const f = filterById(state.filter);
    const full = cropFor(state.img, state.frame, Math.min(4032, GPU ? GPU.maxTex : 4032));
    const outC = compose(process(full, f), state.frame, state.stamp, state.date);
    const png = state.frame === "instax" || state.frame === "wide";  // 透明外圍要用 PNG 才保得住
    const blob = await new Promise(r => outC.toBlob(r, png ? "image/png" : "image/jpeg", .93));
    const d = new Date(), p = n => String(n).padStart(2, "0");
    const filename = `底片盒_${f.name.replace(/[^\w]+/g, "")}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${png ? "png" : "jpg"}`;
    $("busy").hidden = true;
    render();
    let dl = null;
    try { dl = window.claude ? await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; } catch { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); $("hint").innerHTML = "<b>已送出儲存。</b>在分享選單選「儲存影像」就會進相簿。"; return; }
      catch (err) { if (err && err.code === "declined") return; }
    }
    showResult(blob, filename);
  } catch (err) {
    $("busy").hidden = true;
    $("hint").textContent = "照片太大處理不了，請換一張較小的照片再試。";
  }
});
/* 手機：用系統分享選單存到相簿（必須在按鈕點擊當下呼叫，所以放在完成畫面的按鈕上） */
let resultFile = null;
function showResult(blob, filename) {
  const img = $("result-img");
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(blob);
  resultFile = new File([blob], filename, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [resultFile] }));
  $("result-share").hidden = !canShare;
  $("result-tip").textContent = canShare ? "按「存到相簿」，在分享選單選「儲存影像」。也可以長按照片存。" : "長按照片，選「加入照片」就能存到相簿。";
  $("result").hidden = false;
}
$("result-share").addEventListener("click", async () => {
  if (!resultFile) return;
  try { await navigator.share({ files: [resultFile] }); }
  catch (err) { if (err && err.name !== "AbortError") $("result-tip").textContent = "分享選單打不開，請改用長按照片存到相簿。"; }
});
$("result-close").addEventListener("click", () => { $("result").hidden = true; });

/* 啟動：直接進相機 */
buildStrip(); buildFrames(); setHint();
(async () => { try { await document.fonts.load('40px "Share Tech Mono"'); } catch {} })();
enterCamera();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.mode === "camera" && (!stream || stream.getVideoTracks().every(t => t.readyState === "ended"))) startCamera();
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.mode === "edit" && state.img) { rebuildSource(); render(); } }, 200); });
